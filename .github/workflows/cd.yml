name: Continuous Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Private VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Transfer Project Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "apps/,infra/,package.json,package-lock.json,tsconfig.base.json"
          target: "/opt/health"

      - name: Build & Start Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/health"
            cd "$DEPLOY_DIR"

            if [ ! -f "$DEPLOY_DIR/.env" ] && [ -f "$DEPLOY_DIR/.env.production" ]; then
              cp "$DEPLOY_DIR/.env.production" "$DEPLOY_DIR/.env"
            fi

            echo "==> Cleaning up any old/conflicting containers..."
            docker compose -f infra/docker-compose.prod.yml down --remove-orphans || true

            echo "==> Building and starting container stack on VPS using local .env..."
            if ! docker compose -f infra/docker-compose.prod.yml up -d --build --force-recreate --remove-orphans; then
              echo "==> Startup failed. Resetting stale volumes and retrying..."
              docker compose -f infra/docker-compose.prod.yml down -v --remove-orphans || true
              docker compose -f infra/docker-compose.prod.yml up -d --build --force-recreate --remove-orphans
            fi

            echo "==> Running automated admin bootstrap..."
            docker compose -f infra/docker-compose.prod.yml exec -T api npm run admin:bootstrap || true

            echo "==> Cleaning up unused Docker images..."
            docker image prune -af --filter "until=24h" || true

            echo "==> Service Status:"
            docker compose -f infra/docker-compose.prod.yml ps
