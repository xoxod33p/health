name: Continuous Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Private VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Transfer Project Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "apps/,infra/,.env.example,package.json,package-lock.json,tsconfig.base.json"
          target: "/opt/health"

      - name: Build & Start Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/health"
            cd "$DEPLOY_DIR"

            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              echo "==> Creating initial VPS .env from .env.example..."
              cp "$DEPLOY_DIR/.env.example" "$DEPLOY_DIR/.env"
            fi

            # Auto-sync missing keys into VPS .env without overwriting existing settings
            if ! grep -q "^JWT_SECRET=" "$DEPLOY_DIR/.env" 2>/dev/null; then
              echo "JWT_SECRET=care_signal_secure_prod_jwt_secret_99812_key!" >> "$DEPLOY_DIR/.env"
            fi
            if ! grep -q "^NEXT_PUBLIC_API_URL=" "$DEPLOY_DIR/.env" 2>/dev/null; then
              echo "NEXT_PUBLIC_API_URL=https://test.xoxod33p.tech/api/v1" >> "$DEPLOY_DIR/.env"
            fi
            if ! grep -q "^WEB_ORIGIN=" "$DEPLOY_DIR/.env" 2>/dev/null; then
              echo "WEB_ORIGIN=https://test.xoxod33p.tech" >> "$DEPLOY_DIR/.env"
            fi
            if ! grep -q "^MONGODB_URI=" "$DEPLOY_DIR/.env" 2>/dev/null; then
              echo "MONGODB_URI=mongodb://healthcare:healthcare_prod_secret_123!@mongodb:27017/healthcare?authSource=admin" >> "$DEPLOY_DIR/.env"
            fi

            DOMAIN=$(grep ^DOMAIN_NAME "$DEPLOY_DIR/.env" | cut -d '=' -f 2 | tr -d '\r' || echo "test.xoxod33p.tech")
            if [ -z "$DOMAIN" ]; then DOMAIN="test.xoxod33p.tech"; fi

            echo "==> Ensuring SSL certificate directory exists for $DOMAIN..."
            sudo mkdir -p "/etc/letsencrypt/live/$DOMAIN" "/var/www/certbot" || mkdir -p "/etc/letsencrypt/live/$DOMAIN" "/var/www/certbot" || true
            if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              echo "==> Generating SSL certificate for $DOMAIN..."
              (sudo openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout "/etc/letsencrypt/live/$DOMAIN/privkey.pem" \
                -out "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" \
                -subj "/CN=$DOMAIN" || openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout "/etc/letsencrypt/live/$DOMAIN/privkey.pem" \
                -out "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" \
                -subj "/CN=$DOMAIN") || true
              sudo chmod 644 "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" "/etc/letsencrypt/live/$DOMAIN/privkey.pem" || true
            fi

            echo "==> Cleaning up any old/conflicting containers..."
            docker compose -f infra/docker-compose.yml down --remove-orphans || true

            echo "==> Building and starting container stack on VPS using local .env..."
            if ! docker compose -f infra/docker-compose.yml up -d --build --force-recreate --remove-orphans; then
              echo "==> Startup failed. Resetting stale volumes and retrying..."
              docker compose -f infra/docker-compose.yml down -v --remove-orphans || true
              docker compose -f infra/docker-compose.yml up -d --build --force-recreate --remove-orphans
            fi

            echo "==> Running automated admin bootstrap..."
            docker compose -f infra/docker-compose.yml exec -T api npm run admin:bootstrap || true

            echo "==> Cleaning up unused Docker images..."
            docker image prune -af --filter "until=24h" || true

            echo "==> Service Status:"
            docker compose -f infra/docker-compose.yml ps
