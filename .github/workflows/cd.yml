name: Continuous Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      api_image: ghcr.io/${{ github.repository_owner }}/health-api:${{ github.sha }}
      web_image: ghcr.io/${{ github.repository_owner }}/health-web:${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-api:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-api:latest

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-web:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-web:latest

  deploy:
    name: Deploy to Private Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner Name
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/health"
            mkdir -p "$DEPLOY_DIR/infra/nginx/conf.d"
            
            # Log in to GHCR on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Set environment variables for compose deployment
            export API_IMAGE="ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-api:${{ github.sha }}"
            export WEB_IMAGE="ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-web:${{ github.sha }}"
            export GITHUB_REPOSITORY_OWNER="${{ steps.repo_owner.outputs.owner }}"

            # Write production .env file on VPS if secret provided
            cat << 'EOF' > "$DEPLOY_DIR/.env"
            ${{ secrets.PROD_ENV_FILE }}
            EOF
            
            # Set ownership/permissions on .env
            chmod 600 "$DEPLOY_DIR/.env"

            # Create compose stack directory and pull latest images
            cd "$DEPLOY_DIR"

      - name: Transfer Compose and Nginx Configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "infra/docker-compose.prod.yml,infra/nginx/"
          target: "/opt/health"

      - name: Execute Compose Up & Health Check on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/health"
            cd "$DEPLOY_DIR"

            export API_IMAGE="ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-api:${{ github.sha }}"
            export WEB_IMAGE="ghcr.io/${{ steps.repo_owner.outputs.owner }}/health-web:${{ github.sha }}"
            export GITHUB_REPOSITORY_OWNER="${{ steps.repo_owner.outputs.owner }}"

            echo "==> Pulling container images..."
            docker compose -f infra/docker-compose.prod.yml pull

            echo "==> Deploying container stack..."
            docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans

            echo "==> Cleaning up unused Docker images..."
            docker image prune -af --filter "until=24h" || true

            echo "==> Service Status:"
            docker compose -f infra/docker-compose.prod.yml ps
