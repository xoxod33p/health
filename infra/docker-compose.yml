services:
  mongodb:
    image: mongo:4.4.29
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-healthcare}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-healthcare_prod_secret_123!}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-healthcare}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - health-network
    healthcheck:
      test: ["CMD-SHELL", "mongo -u \"$${MONGO_INITDB_ROOT_USERNAME:-healthcare}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD:-healthcare_prod_secret_123!}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" || mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME:-healthcare}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD:-healthcare_prod_secret_123!}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" || mongo --eval \"db.adminCommand('ping').ok\" || mongosh --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_prod_secret_123!}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_secret_123!}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - health-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis_prod_secret_123!}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  health-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
