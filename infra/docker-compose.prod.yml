services:
  mongodb:
    image: mongo:8.0.4
    container_name: caresignal-mongodb
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-healthcare}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-healthcare_prod_secret_123!}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-healthcare}
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - caresignal_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME:-healthcare}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD:-healthcare_prod_secret_123!}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" || mongosh --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    container_name: caresignal-redis
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_prod_secret_123!}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_secret_123!}
    volumes:
      - redis_prod_data:/data
    networks:
      - caresignal_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis_prod_secret_123!}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: caresignal-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-healthcare}:${MONGO_ROOT_PASSWORD:-healthcare_prod_secret_123!}@mongodb:27017/${MONGO_DATABASE:-healthcare}?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_prod_secret_123!}@redis:6379}
      STORAGE_PATH: /app/storage
      WEB_ORIGIN: ${WEB_ORIGIN:-https://${DOMAIN_NAME:-localhost}}
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      JWT_SECRET: ${JWT_SECRET:-care_signal_secure_prod_jwt_secret_99812_key!}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@localhost.test}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-ChangeMe_dev_only_123!}
      DEFAULT_ADMIN_ROLE: ${DEFAULT_ADMIN_ROLE:-SYSTEM_ADMIN}
      DEFAULT_ADMIN_COMPANY_ID: ${DEFAULT_ADMIN_COMPANY_ID:-production-company}
    volumes:
      - storage_prod_data:/app/storage
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caresignal_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN_NAME:-localhost}/api/v1}
    container_name: caresignal-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN_NAME:-localhost}/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - caresignal_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  caresignal_network:
    driver: bridge

volumes:
  mongodb_prod_data:
  redis_prod_data:
  storage_prod_data:
